[package]
name = "soldecomp-replay"
version = "0.1.0"
edition = "2021"

[dependencies]
agave-feature-set = "3.1.14"
base64 = "0.22"
bincode = "1.3"
hex = "0.4"
litesvm = { version = "=0.12.0", features = ["register-tracing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-account = "3.2"
solana-address = "2.6"
solana-clock = "3.0"
solana-epoch-rewards = "3.2"
solana-epoch-schedule = "3.4"
solana-instruction = "3.4"
solana-last-restart-slot = "3.2"
solana-message = "3.1"
solana-rent = "3.1"
solana-signature = "3.4"
solana-slot-hashes = "3.2"
solana-stake-interface = "2.0"
solana-transaction = "3.0"

[patch.crates-io]
litesvm = { path = "vendor/litesvm-0.12.0" }

[profile.dev]
debug = 0
split-debuginfo = "off"
